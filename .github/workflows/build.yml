name: Build BoxFinder.exe
 
on:
  push:
    paths:
      - 'boxfinder.py'
  workflow_dispatch:
 
jobs:
  build:
    runs-on: windows-latest
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: pip install pyinstaller
 
      - name: Build .exe
        run: pyinstaller --onefile --windowed --name "BoxFinder" boxfinder.py
 
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxFinder-Windows
          path: dist/BoxFinder.exe
 
